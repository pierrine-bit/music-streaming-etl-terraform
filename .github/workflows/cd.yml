name: Terraform CD

# Runs on merge to main. The `production` environment gate pauses the apply
# until a reviewer approves it (configure required reviewers in
# Settings > Environments > production).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.7" # keep in sync with ci.yml
  AWS_REGION: eu-west-1
  TF_VAR_aws_region: eu-west-1
  TF_INPUT: "false"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform apply
        run: terraform apply -auto-approve -no-color -lock-timeout=5m
