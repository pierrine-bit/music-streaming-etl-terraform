name: Terraform CI

# Runs on pull requests to main: format, validate, and a speculative plan.
# No apply here — that happens in cd.yml after merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read
  pull-requests: write # to post the plan summary as a PR comment

env:
  TF_VERSION: "1.15.7" # must match the local version that wrote the state
  AWS_REGION: eu-west-1
  TF_VAR_aws_region: eu-west-1
  TF_INPUT: "false"

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check (Glue + Lambda)
        run: python -m py_compile glue_scripts/*.py lambda/*.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan', { maxBuffer: 10 * 1024 * 1024 }).toString();
            const body = `#### Terraform Plan 📖\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
