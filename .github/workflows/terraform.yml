name: Terraform
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.15.7" # must match the local version that wrote the state
  AWS_REGION: eu-west-1
  TF_VAR_aws_region: eu-west-1
  TF_INPUT: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (pytest)
        run: pytest -q

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive -f compact

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform # scan Terraform only (skips the slow crawl over data/)
          config_file: .checkov.yaml
          quiet: true
          soft_fail: true # non-blocking; exceptions documented in .checkov.yaml

  terraform:
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')) && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # DCE sandbox blocks OIDC federation, so authenticate with short-lived key secrets (refresh before running).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: github.event_name == 'pull_request' || inputs.action == 'plan'
        run: terraform plan -no-color -lock-timeout=5m

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve -no-color -lock-timeout=5m

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color -lock-timeout=5m
