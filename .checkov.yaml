# Checkov configuration. Findings we consciously accept are skipped here with a
# rationale; everything else is still scanned. Per-resource exceptions (e.g.
# point-in-time recovery on lock tables) use inline `# checkov:skip=` comments.
skip-check:
  # DynamoDB tables hold non-sensitive, recomputable analytical aggregates.
  # AWS-owned encryption at rest is sufficient; a customer-managed KMS key would
  # add cost and key management with no meaningful benefit here.
