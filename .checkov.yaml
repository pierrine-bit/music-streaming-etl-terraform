  # "*" resource in IAM is intentional and scoped: the GitHub Actions CI role
  # needs broad Terraform permissions, and Glue continuous logging writes to
  # dynamically-named CloudWatch log groups that can't be enumerated up front.
  - CKV_AWS_356
  # The workflow_dispatch plan/apply/destroy dropdown is a deliberate manual
  # control for this pipeline, not an untrusted build input.
  - CKV_GHA_7
